<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Southwestern adobe pueblo-style treatment facility with stepped levels, vigas, and desert landscape"><defs><linearGradient id="sky-ad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FAEFE0"/><stop offset="1" stop-color="#F1F4EE"/></linearGradient><linearGradient id="wall-ad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D8B89A"/><stop offset="1" stop-color="#B8946F"/></linearGradient><linearGradient id="wallS-ad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B8946F"/><stop offset="1" stop-color="#947351"/></linearGradient><radialGradient id="win-ad" cx=".5" cy=".5" r=".55"><stop offset="0" stop-color="#FFF8E8"/><stop offset="1" stop-color="#EFE0CB"/></radialGradient></defs><rect width="1600" height="1200" fill="url(#sky-ad)"/><circle cx="240" cy="220" r="100" fill="#EFE0CB" opacity=".55"/><circle cx="240" cy="220" r="42" fill="#EFE0CB" opacity=".85"/><!-- Distant desert mesas --><path d="M 0,820 L 200,720 L 200,820 L 380,820 L 380,700 L 540,700 L 540,820 L 1080,820 L 1080,750 L 1240,750 L 1240,820 L 1400,820 L 1400,700 L 1600,700 L 1600,900 L 0,900 Z" fill="#B8946F" opacity=".55"/><!-- Distant ground line --><rect x="0" y="900" width="1600" height="80" fill="#A3B795" opacity=".5"/><!-- Saguaro cactus, left --><g transform="translate(220,840)"><rect x="-15" y="0" width="30" height="180" rx="14" fill="#5F7A57"/><rect x="-50" y="60" width="35" height="14" rx="6" fill="#5F7A57"/><rect x="-50" y="60" width="14" height="80" rx="6" fill="#5F7A57"/><rect x="15" y="40" width="35" height="14" rx="6" fill="#5F7A57"/><rect x="36" y="40" width="14" height="100" rx="6" fill="#5F7A57"/></g><g transform="translate(1340,860)"><rect x="-12" y="0" width="24" height="140" rx="12" fill="#5F7A57"/><rect x="-44" y="40" width="32" height="12" rx="6" fill="#5F7A57"/><rect x="-44" y="40" width="12" height="60" rx="6" fill="#5F7A57"/></g><!-- Adobe building - tiered/stepped --><!-- Tier 1 (back, tallest) --><rect x="600" y="380" width="400" height="520" fill="url(#wallS-ad)"/><!-- Tier 2 (middle right) --><rect x="1000" y="500" width="280" height="400" fill="url(#wall-ad)"/><!-- Tier 3 (front left) --><rect x="320" y="600" width="280" height="300" fill="url(#wall-ad)"/><!-- Soft rounded corner suggestions --><path d="M 320,600 Q 320,580 340,580 L 600,580 L 600,600 Z" fill="url(#wall-ad)"/><path d="M 600,380 Q 600,360 620,360 L 1000,360 L 1000,380 Z" fill="url(#wallS-ad)"/><path d="M 1000,500 Q 1000,480 1020,480 L 1280,480 L 1280,500 Z" fill="url(#wall-ad)"/><!-- Wall outlines --><rect x="600" y="380" width="400" height="520" fill="none" stroke="#7E5238" stroke-width="2"/><rect x="1000" y="500" width="280" height="400" fill="none" stroke="#7E5238" stroke-width="2"/><rect x="320" y="600" width="280" height="300" fill="none" stroke="#7E5238" stroke-width="2"/><!-- Vigas (protruding wood beams) --><g fill="#5F4226"><!-- Tier 1 vigas --><rect x="595" y="400" width="14" height="14"/><rect x="595" y="450" width="14" height="14"/><rect x="595" y="500" width="14" height="14"/><rect x="595" y="550" width="14" height="14"/><rect x="1000" y="400" width="14" height="14"/><rect x="1000" y="450" width="14" height="14"/><rect x="1000" y="500" width="14" height="14"/><!-- Tier 2 vigas --><rect x="1275" y="520" width="14" height="14"/><rect x="1275" y="570" width="14" height="14"/><rect x="1275" y="620" width="14" height="14"/><!-- Tier 3 vigas --><rect x="315" y="620" width="14" height="14"/><rect x="315" y="670" width="14" height="14"/><rect x="595" y="620" width="14" height="14"/></g><!-- Roof parapet caps --><rect x="320" y="595" width="280" height="10" fill="#5F4226"/><rect x="600" y="375" width="400" height="10" fill="#5F4226"/><rect x="1000" y="495" width="280" height="10" fill="#5F4226"/><!-- Windows (deep-set, small) --><g><rect x="650" y="500" width="80" height="100" rx="3" fill="url(#win-ad)" stroke="#5F4226" stroke-width="3"/><rect x="770" y="500" width="80" height="100" rx="3" fill="url(#win-ad)" stroke="#5F4226" stroke-width="3"/><rect x="890" y="500" width="80" height="100" rx="3" fill="url(#win-ad)" stroke="#5F4226" stroke-width="3"/><rect x="650" y="650" width="80" height="100" rx="3" fill="url(#win-ad)" stroke="#5F4226" stroke-width="3"/><rect x="890" y="650" width="80" height="100" rx="3" fill="url(#win-ad)" stroke="#5F4226" stroke-width="3"/><rect x="1050" y="580" width="80" height="100" rx="3" fill="url(#win-ad)" stroke="#5F4226" stroke-width="3"/><rect x="1170" y="580" width="80" height="100" rx="3" fill="url(#win-ad)" stroke="#5F4226" stroke-width="3"/><rect x="1050" y="720" width="80" height="100" rx="3" fill="url(#win-ad)" stroke="#5F4226" stroke-width="3"/><rect x="370" y="650" width="80" height="100" rx="3" fill="url(#win-ad)" stroke="#5F4226" stroke-width="3"/></g><!-- Carved wood door (centered) --><rect x="780" y="760" width="120" height="140" rx="3" fill="#5F4226"/><rect x="790" y="770" width="100" height="130" rx="2" fill="#7E5E48" stroke="#5F4226" stroke-width="2"/><line x1="840" y1="770" x2="840" y2="900" stroke="#5F4226" stroke-width="2"/><g stroke="#3F2618" stroke-width="1.5"><line x1="800" y1="800" x2="830" y2="800"/><line x1="850" y1="800" x2="880" y2="800"/><line x1="800" y1="830" x2="830" y2="830"/><line x1="850" y1="830" x2="880" y2="830"/><line x1="800" y1="860" x2="830" y2="860"/><line x1="850" y1="860" x2="880" y2="860"/></g><circle cx="870" cy="840" r="5" fill="#3F2618"/><!-- Door portico (vigas with bench shadow) --><rect x="770" y="750" width="140" height="14" fill="#5F4226"/><g fill="#3F2618"><rect x="780" y="764" width="6" height="14"/><rect x="800" y="764" width="6" height="14"/><rect x="820" y="764" width="6" height="14"/><rect x="840" y="764" width="6" height="14"/><rect x="860" y="764" width="6" height="14"/><rect x="880" y="764" width="6" height="14"/><rect x="894" y="764" width="6" height="14"/></g><!-- Outdoor ladder (kiva-style detail) --><g stroke="#5F4226" stroke-width="6"><line x1="540" y1="600" x2="560" y2="380"/><line x1="580" y1="600" x2="600" y2="380"/></g><g stroke="#5F4226" stroke-width="4"><line x1="550" y1="560" x2="595" y2="555"/><line x1="555" y1="520" x2="600" y2="515"/><line x1="560" y1="480" x2="605" y2="475"/><line x1="565" y1="440" x2="610" y2="435"/></g><!-- Sandy ground --><rect x="0" y="900" width="1600" height="300" fill="#D8B89A"/><rect x="0" y="900" width="1600" height="14" fill="#B8946F"/><!-- Sandy texture dots --><g fill="#B8946F" opacity=".4"><circle cx="200" cy="1000" r="3"/><circle cx="350" cy="1040" r="2"/><circle cx="450" cy="1020" r="3"/><circle cx="600" cy="1060" r="2"/><circle cx="750" cy="1030" r="3"/><circle cx="900" cy="1070" r="2"/><circle cx="1100" cy="1040" r="3"/><circle cx="1250" cy="1080" r="2"/><circle cx="1400" cy="1050" r="3"/></g><!-- Stone walkway --><g fill="#947351" stroke="#7E5238" stroke-width="2"><ellipse cx="840" cy="970" rx="56" ry="18"/><ellipse cx="840" cy="1030" rx="62" ry="20"/><ellipse cx="840" cy="1100" rx="70" ry="24"/><ellipse cx="840" cy="1180" rx="78" ry="28"/></g><g opacity=".4" transform="translate(60,60)"><rect x="0" y="0" width="44" height="44" rx="10" fill="none" stroke="#2C2E2A" stroke-width="2"/><path d="M 11,23 L 19,31 L 33,15" fill="none" stroke="#2C2E2A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></svg>