<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Heavy-timber mountain lodge treatment facility with steep gable, stone chimney, and snow-capped peaks"><defs><linearGradient id="sky-mn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8F5EF"/><stop offset="1" stop-color="#F1F4EE"/></linearGradient><linearGradient id="wall-mn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#947F5E"/><stop offset="1" stop-color="#7E5E48"/></linearGradient><linearGradient id="roof-mn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3F5A3A"/><stop offset="1" stop-color="#5F7A57"/></linearGradient><radialGradient id="win-mn" cx=".5" cy=".5" r=".55"><stop offset="0" stop-color="#FFF8E8"/><stop offset="1" stop-color="#EFE0CB"/></radialGradient></defs><rect width="1600" height="1200" fill="url(#sky-mn)"/><circle cx="1340" cy="180" r="70" fill="#EFE0CB" opacity=".5"/><circle cx="1340" cy="180" r="30" fill="#EFE0CB" opacity=".85"/><!-- Snow-capped mountain peaks --><path d="M 0,720 L 200,440 L 360,620 L 540,360 L 740,580 L 900,420 L 1100,600 L 1280,400 L 1460,560 L 1600,500 L 1600,820 L 0,820 Z" fill="#A3B795" opacity=".55"/><!-- Snow caps --><g fill="#F8F5EF"><path d="M 540,360 L 580,440 L 500,440 Z" opacity=".9"/><path d="M 1280,400 L 1320,480 L 1240,480 Z" opacity=".9"/><path d="M 200,440 L 240,500 L 160,500 Z" opacity=".7"/><path d="M 900,420 L 940,490 L 860,490 Z" opacity=".7"/></g><!-- Mid-distance hill --><path d="M 0,800 C 280,720 540,780 800,760 C 1060,740 1320,780 1600,750 L 1600,880 L 0,880 Z" fill="#7E9874" opacity=".65"/><!-- Evergreens, dense --><g transform="translate(140,720)"><rect x="-10" y="290" width="20" height="80" fill="#5F4226"/><path d="M 0,0 L 100,170 L 60,170 L 120,290 L 70,290 L 130,400 L -130,400 L -70,290 L -120,290 L -60,170 L -100,170 Z" fill="#3F5A3A"/></g><g transform="translate(290,760)"><rect x="-10" y="260" width="20" height="80" fill="#5F4226"/><path d="M 0,0 L 90,150 L 55,150 L 110,260 L 65,260 L 120,360 L -120,360 L -65,260 L -110,260 L -55,150 L -90,150 Z" fill="#5F7A57"/></g><g transform="translate(1310,740)"><rect x="-10" y="280" width="20" height="80" fill="#5F4226"/><path d="M 0,0 L 105,170 L 65,170 L 125,290 L 75,290 L 135,400 L -135,400 L -75,290 L -125,290 L -65,170 L -105,170 Z" fill="#3F5A3A"/></g><g transform="translate(1470,770)"><rect x="-10" y="260" width="20" height="80" fill="#5F4226"/><path d="M 0,0 L 90,150 L 55,150 L 110,260 L 65,260 L 120,360 L -120,360 L -65,260 L -110,260 L -55,150 L -90,150 Z" fill="#5F7A57"/></g><!-- Lodge --><g><!-- Steep gable roof --><path d="M 470,640 L 800,300 L 1130,640 L 1110,660 L 800,340 L 490,660 Z" fill="url(#roof-mn)"/><rect x="460" y="650" width="680" height="20" fill="#2C2E2A" opacity=".6"/><!-- Gable timber detail --><path d="M 720,560 L 800,470 L 880,560 Z" fill="#5F4226"/><line x1="720" y1="560" x2="880" y2="560" stroke="#3F5A3A" stroke-width="3"/><line x1="760" y1="510" x2="840" y2="510" stroke="#3F5A3A" stroke-width="3"/><line x1="800" y1="470" x2="800" y2="560" stroke="#3F5A3A" stroke-width="3"/><!-- Tall stone chimney --><rect x="1010" y="380" width="80" height="290" fill="#947F5E"/><rect x="1000" y="372" width="100" height="14" fill="#5F4226"/><g fill="#7E5E48" opacity=".7"><rect x="1025" y="400" width="25" height="20"/><rect x="1055" y="400" width="30" height="20"/><rect x="1020" y="430" width="30" height="20"/><rect x="1055" y="430" width="25" height="20"/><rect x="1025" y="460" width="25" height="20"/><rect x="1055" y="460" width="30" height="20"/><rect x="1020" y="490" width="30" height="20"/><rect x="1055" y="490" width="25" height="20"/><rect x="1025" y="520" width="25" height="20"/><rect x="1055" y="520" width="30" height="20"/><rect x="1020" y="550" width="30" height="20"/><rect x="1055" y="550" width="25" height="20"/><rect x="1025" y="580" width="25" height="20"/><rect x="1055" y="580" width="30" height="20"/><rect x="1020" y="610" width="30" height="20"/><rect x="1055" y="610" width="25" height="20"/><rect x="1025" y="640" width="25" height="20"/></g><!-- Walls (timber) --><rect x="490" y="670" width="640" height="350" fill="url(#wall-mn)"/><rect x="490" y="670" width="640" height="350" fill="none" stroke="#5F4226" stroke-width="3"/><g stroke="#5F4226" stroke-width="2" opacity=".4"><line x1="490" y1="720" x2="1130" y2="720"/><line x1="490" y1="780" x2="1130" y2="780"/><line x1="490" y1="840" x2="1130" y2="840"/><line x1="490" y1="900" x2="1130" y2="900"/><line x1="490" y1="960" x2="1130" y2="960"/></g><!-- Large windows --><rect x="540" y="730" width="160" height="240" rx="3" fill="url(#win-mn)" stroke="#5F4226" stroke-width="3"/><line x1="620" y1="730" x2="620" y2="970" stroke="#5F4226" stroke-width="2"/><line x1="540" y1="850" x2="700" y2="850" stroke="#5F4226" stroke-width="2"/><rect x="900" y="730" width="160" height="240" rx="3" fill="url(#win-mn)" stroke="#5F4226" stroke-width="3"/><line x1="980" y1="730" x2="980" y2="970" stroke="#5F4226" stroke-width="2"/><line x1="900" y1="850" x2="1060" y2="850" stroke="#5F4226" stroke-width="2"/><!-- Stone-clad entrance area --><rect x="730" y="780" width="140" height="240" fill="#947F5E"/><g fill="#7E5E48" opacity=".7"><rect x="745" y="790" width="40" height="20"/><rect x="800" y="790" width="50" height="20"/><rect x="745" y="820" width="50" height="20"/><rect x="805" y="820" width="40" height="20"/><rect x="745" y="980" width="40" height="20"/><rect x="800" y="980" width="50" height="20"/><rect x="745" y="1000" width="50" height="20"/><rect x="805" y="1000" width="40" height="20"/></g><!-- Arched timber door --><path d="M 750,860 L 750,1020 L 850,1020 L 850,860 A 50,50 0 0 0 750,860 Z" fill="#5F4226"/><path d="M 760,870 L 760,1010 L 840,1010 L 840,870 A 40,40 0 0 0 760,870 Z" fill="#7E5E48" stroke="#3F5A3A" stroke-width="2"/><path d="M 770,880 L 770,920 L 830,920 L 830,880 A 30,30 0 0 0 770,880 Z" fill="url(#win-mn)" stroke="#3F5A3A" stroke-width="2"/><circle cx="820" cy="960" r="4" fill="#3F5A3A"/></g><!-- Snow-dusted ground --><path d="M 0,1020 C 280,1010 540,1020 800,1015 C 1060,1010 1320,1020 1600,1010 L 1600,1200 L 0,1200 Z" fill="#EFE9DE"/><path d="M 0,1020 C 280,1010 540,1020 800,1015 C 1060,1010 1320,1020 1600,1010" fill="none" stroke="#D8CFBD" stroke-width="3"/><!-- Stone path --><g fill="#947F5E" stroke="#5F4226" stroke-width="2"><ellipse cx="800" cy="1060" rx="52" ry="18"/><ellipse cx="800" cy="1110" rx="58" ry="20"/><ellipse cx="800" cy="1170" rx="64" ry="22"/></g><g opacity=".4" transform="translate(60,60)"><rect x="0" y="0" width="44" height="44" rx="10" fill="none" stroke="#2C2E2A" stroke-width="2"/><path d="M 11,23 L 19,31 L 33,15" fill="none" stroke="#2C2E2A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></svg>