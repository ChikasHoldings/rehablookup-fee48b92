<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Wellness retreat lodge nestled among evergreens with mountains in the distance"><defs><linearGradient id="sky-retreat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8F5EF"/><stop offset="1" stop-color="#F1F4EE"/></linearGradient><linearGradient id="wall-retreat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EFE9DE"/><stop offset="1" stop-color="#B8A88F"/></linearGradient><linearGradient id="roof-retreat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5F7A57"/><stop offset="1" stop-color="#7E9874"/></linearGradient><radialGradient id="window-retreat" cx=".5" cy=".5" r=".55"><stop offset="0" stop-color="#FFF8E8"/><stop offset="1" stop-color="#EFE0CB"/></radialGradient><pattern id="dots-retreat" x="0" y="0" width="38" height="38" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#5F7A57" fill-opacity=".05"/></pattern></defs><!-- Sky --><rect width="1600" height="1200" fill="url(#sky-retreat)"/><rect width="1600" height="1200" fill="url(#dots-retreat)"/><!-- Soft sun --><circle cx="1150" cy="240" r="90" fill="#EFE0CB" opacity=".5"/><circle cx="1150" cy="240" r="38" fill="#EFE0CB" opacity=".85"/><!-- Mountain range, back --><path d="M 0,680 L 180,520 L 320,620 L 460,460 L 620,580 L 760,500 L 920,600 L 1080,480 L 1240,580 L 1380,520 L 1600,600 L 1600,820 L 0,820 Z" fill="#A3B795" opacity=".55"/><path d="M 0,760 L 220,620 L 380,720 L 540,580 L 700,700 L 880,640 L 1040,720 L 1200,620 L 1380,720 L 1600,680 L 1600,860 L 0,860 Z" fill="#7E9874" opacity=".75"/><!-- Distant tree line --><g opacity=".55" fill="#5F7A57"><ellipse cx="120" cy="880" rx="60" ry="80"/><ellipse cx="240" cy="900" rx="50" ry="70"/><ellipse cx="1380" cy="880" rx="60" ry="80"/><ellipse cx="1500" cy="900" rx="50" ry="70"/></g><!-- Trees, left --><g transform="translate(180,720)"><rect x="-10" y="240" width="20" height="100" fill="#7E5E48"/><path d="M 0,0 L 90,140 L 50,140 L 110,250 L 60,250 L 120,360 L -120,360 L -60,250 L -110,250 L -50,140 L -90,140 Z" fill="#5F7A57"/></g><g transform="translate(330,780)"><rect x="-8" y="200" width="16" height="80" fill="#7E5E48"/><path d="M 0,0 L 70,110 L 40,110 L 85,200 L 50,200 L 95,290 L -95,290 L -50,200 L -85,200 L -40,110 L -70,110 Z" fill="#7E9874"/></g><!-- Trees, right --><g transform="translate(1300,760)"><rect x="-10" y="220" width="20" height="100" fill="#7E5E48"/><path d="M 0,0 L 95,150 L 55,150 L 115,260 L 65,260 L 125,370 L -125,370 L -65,260 L -115,260 L -55,150 L -95,150 Z" fill="#5F7A57"/></g><g transform="translate(1470,820)"><rect x="-8" y="180" width="16" height="80" fill="#7E5E48"/><path d="M 0,0 L 65,100 L 35,100 L 80,180 L 45,180 L 90,260 L -90,260 L -45,180 L -80,180 L -35,100 L -65,100 Z" fill="#7E9874"/></g><!-- Lodge --><g><!-- Long roof, pitched --><path d="M 400,680 L 800,520 L 1200,680 L 1180,700 L 800,540 L 420,700 Z" fill="url(#roof-retreat)"/><rect x="410" y="690" width="780" height="18" fill="#5F7A57"/><!-- Chimney --><rect x="950" y="580" width="44" height="100" fill="#B8A88F"/><rect x="944" y="574" width="56" height="14" fill="#7E5E48"/><!-- Walls --><rect x="430" y="708" width="740" height="320" fill="url(#wall-retreat)"/><!-- Horizontal wood plank lines --><line x1="430" y1="760" x2="1170" y2="760" stroke="#B8A88F" stroke-width="1.5" opacity=".7"/><line x1="430" y1="820" x2="1170" y2="820" stroke="#B8A88F" stroke-width="1.5" opacity=".7"/><line x1="430" y1="880" x2="1170" y2="880" stroke="#B8A88F" stroke-width="1.5" opacity=".7"/><line x1="430" y1="940" x2="1170" y2="940" stroke="#B8A88F" stroke-width="1.5" opacity=".7"/><rect x="430" y="708" width="740" height="320" fill="none" stroke="#7E5E48" stroke-width="2"/><!-- Wide windows --><g><rect x="470" y="780" width="180" height="180" rx="3" fill="url(#window-retreat)" stroke="#7E5E48" stroke-width="3"/><line x1="560" y1="780" x2="560" y2="960" stroke="#7E5E48" stroke-width="2"/><line x1="470" y1="870" x2="650" y2="870" stroke="#7E5E48" stroke-width="2"/><rect x="950" y="780" width="180" height="180" rx="3" fill="url(#window-retreat)" stroke="#7E5E48" stroke-width="3"/><line x1="1040" y1="780" x2="1040" y2="960" stroke="#7E5E48" stroke-width="2"/><line x1="950" y1="870" x2="1130" y2="870" stroke="#7E5E48" stroke-width="2"/></g><!-- Door, centered --><rect x="720" y="820" width="160" height="208" rx="6" fill="#7E5E48"/><rect x="720" y="820" width="160" height="208" rx="6" fill="none" stroke="#4A3422" stroke-width="3"/><rect x="735" y="835" width="130" height="100" rx="3" fill="url(#window-retreat)" stroke="#4A3422" stroke-width="2"/><line x1="800" y1="835" x2="800" y2="935" stroke="#4A3422" stroke-width="1.5"/><circle cx="860" cy="940" r="5" fill="#4A3422"/><!-- Door overhang --><path d="M 700,790 L 900,790 L 920,820 L 680,820 Z" fill="#5F7A57"/></g><!-- Ground (grass slope) --><path d="M 0,1000 C 240,990 480,1005 800,995 C 1120,985 1360,1000 1600,990 L 1600,1200 L 0,1200 Z" fill="#7E9874"/><path d="M 0,1000 C 240,990 480,1005 800,995 C 1120,985 1360,1000 1600,990" fill="none" stroke="#5F7A57" stroke-width="3"/><!-- Stone path --><g fill="#D8CFBD" stroke="#B8A88F" stroke-width="2"><ellipse cx="800" cy="1060" rx="56" ry="22"/><ellipse cx="750" cy="1110" rx="56" ry="22"/><ellipse cx="850" cy="1110" rx="56" ry="22"/><ellipse cx="800" cy="1160" rx="60" ry="24"/></g><!-- Foreground shrubs --><g><ellipse cx="500" cy="1020" rx="70" ry="26" fill="#5F7A57"/><ellipse cx="500" cy="1010" rx="70" ry="26" fill="#7E9874"/><ellipse cx="1100" cy="1020" rx="70" ry="26" fill="#5F7A57"/><ellipse cx="1100" cy="1010" rx="70" ry="26" fill="#7E9874"/></g><!-- Verification mark --><g opacity=".4" transform="translate(60,60)"><rect x="0" y="0" width="44" height="44" rx="10" fill="none" stroke="#2C2E2A" stroke-width="2"/><path d="M 11,23 L 19,31 L 33,15" fill="none" stroke="#2C2E2A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></svg>