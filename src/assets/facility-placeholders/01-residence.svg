<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Two-story residential treatment home with pitched roof, warm-lit windows, and a small garden"><defs><linearGradient id="sky-residence" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8F5EF"/><stop offset="1" stop-color="#F1F4EE"/></linearGradient><linearGradient id="wall-residence" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EFE9DE"/><stop offset="1" stop-color="#D8CFBD"/></linearGradient><linearGradient id="roof-residence" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5F7A57"/><stop offset="1" stop-color="#7E9874"/></linearGradient><radialGradient id="window-residence" cx=".5" cy=".5" r=".55"><stop offset="0" stop-color="#FFF8E8"/><stop offset="1" stop-color="#EFE0CB"/></radialGradient><pattern id="dots-residence" x="0" y="0" width="38" height="38" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#5F7A57" fill-opacity=".05"/></pattern></defs><!-- Sky --><rect width="1600" height="1200" fill="url(#sky-residence)"/><rect width="1600" height="1200" fill="url(#dots-residence)"/><!-- Soft sun --><circle cx="280" cy="280" r="90" fill="#EFE0CB" opacity=".55"/><circle cx="280" cy="280" r="40" fill="#EFE0CB" opacity=".85"/><!-- Distant hill --><path d="M 0,960 C 240,910 480,940 800,920 C 1120,900 1360,930 1600,910 L 1600,1000 L 0,1000 Z" fill="#C5D2B6" opacity=".7"/><!-- Tree, left back --><g transform="translate(220,640)"><rect x="-8" y="200" width="16" height="120" fill="#7E9874"/><ellipse cx="0" cy="160" rx="100" ry="170" fill="#A3B795"/><ellipse cx="-30" cy="120" rx="60" ry="110" fill="#7E9874" opacity=".8"/></g><!-- Tree, right back --><g transform="translate(1380,660)"><rect x="-8" y="180" width="16" height="120" fill="#7E9874"/><ellipse cx="0" cy="140" rx="120" ry="200" fill="#A3B795"/><ellipse cx="30" cy="100" rx="70" ry="130" fill="#7E9874" opacity=".8"/></g><!-- House body --><g><!-- Roof --><path d="M 380,540 L 800,300 L 1220,540 Z" fill="url(#roof-residence)"/><!-- Roof shadow under eave --><path d="M 380,540 L 1220,540 L 1220,560 L 380,560 Z" fill="#3F5A3A" opacity=".4"/><!-- Eaves --><rect x="360" y="540" width="880" height="14" fill="#5F7A57"/><!-- Chimney --><rect x="1020" y="360" width="50" height="120" fill="#B8A88F"/><rect x="1014" y="354" width="62" height="14" fill="#7E5E48"/><!-- Walls --><rect x="400" y="554" width="800" height="476" fill="url(#wall-residence)"/><!-- Subtle wall outline --><rect x="400" y="554" width="800" height="476" fill="none" stroke="#B8A88F" stroke-width="2"/><!-- Floor divider trim --><rect x="400" y="780" width="800" height="6" fill="#B8A88F" opacity=".7"/><!-- Upper-floor windows (3 windows) --><g><rect x="450" y="620" width="100" height="120" rx="4" fill="url(#window-residence)" stroke="#7E5E48" stroke-width="3"/><line x1="500" y1="620" x2="500" y2="740" stroke="#7E5E48" stroke-width="2"/><line x1="450" y1="680" x2="550" y2="680" stroke="#7E5E48" stroke-width="2"/><rect x="750" y="620" width="100" height="120" rx="4" fill="url(#window-residence)" stroke="#7E5E48" stroke-width="3"/><line x1="800" y1="620" x2="800" y2="740" stroke="#7E5E48" stroke-width="2"/><line x1="750" y1="680" x2="850" y2="680" stroke="#7E5E48" stroke-width="2"/><rect x="1050" y="620" width="100" height="120" rx="4" fill="url(#window-residence)" stroke="#7E5E48" stroke-width="3"/><line x1="1100" y1="620" x2="1100" y2="740" stroke="#7E5E48" stroke-width="2"/><line x1="1050" y1="680" x2="1150" y2="680" stroke="#7E5E48" stroke-width="2"/></g><!-- Lower-floor windows (2 flanking the door) --><g><rect x="450" y="850" width="120" height="140" rx="4" fill="url(#window-residence)" stroke="#7E5E48" stroke-width="3"/><line x1="510" y1="850" x2="510" y2="990" stroke="#7E5E48" stroke-width="2"/><line x1="450" y1="920" x2="570" y2="920" stroke="#7E5E48" stroke-width="2"/><rect x="1030" y="850" width="120" height="140" rx="4" fill="url(#window-residence)" stroke="#7E5E48" stroke-width="3"/><line x1="1090" y1="850" x2="1090" y2="990" stroke="#7E5E48" stroke-width="2"/><line x1="1030" y1="920" x2="1150" y2="920" stroke="#7E5E48" stroke-width="2"/></g><!-- Porch --><rect x="700" y="990" width="200" height="40" fill="#7E5E48"/><rect x="700" y="990" width="200" height="40" fill="none" stroke="#4A3422" stroke-width="2"/><!-- Porch overhang --><path d="M 680,860 L 800,810 L 920,860 L 900,860 L 800,820 L 700,860 Z" fill="#5F7A57"/><rect x="700" y="848" width="200" height="14" fill="#5F7A57"/><!-- Porch columns --><rect x="710" y="862" width="14" height="138" fill="#B8A88F"/><rect x="876" y="862" width="14" height="138" fill="#B8A88F"/><!-- Door --><rect x="745" y="870" width="110" height="160" rx="6" fill="#C58B73"/><rect x="745" y="870" width="110" height="160" rx="6" fill="none" stroke="#7E5E48" stroke-width="3"/><!-- Door window --><rect x="775" y="890" width="50" height="50" rx="3" fill="url(#window-residence)" stroke="#7E5E48" stroke-width="2"/><!-- Door knob --><circle cx="840" cy="950" r="4" fill="#7E5E48"/></g><!-- Ground --><rect x="0" y="1000" width="1600" height="200" fill="#7E9874"/><rect x="0" y="1000" width="1600" height="14" fill="#5F7A57"/><!-- Walkway --><path d="M 720,1030 L 880,1030 L 920,1200 L 680,1200 Z" fill="#D8CFBD"/><path d="M 720,1030 L 880,1030 L 920,1200 L 680,1200 Z" fill="none" stroke="#B8A88F" stroke-width="2"/><!-- Hedge across front --><g><ellipse cx="510" cy="1040" rx="120" ry="36" fill="#5F7A57"/><ellipse cx="510" cy="1030" rx="120" ry="36" fill="#7E9874"/><ellipse cx="1090" cy="1040" rx="120" ry="36" fill="#5F7A57"/><ellipse cx="1090" cy="1030" rx="120" ry="36" fill="#7E9874"/></g><!-- Verification mark --><g opacity=".4" transform="translate(60,60)"><rect x="0" y="0" width="44" height="44" rx="10" fill="none" stroke="#2C2E2A" stroke-width="2"/><path d="M 11,23 L 19,31 L 33,15" fill="none" stroke="#2C2E2A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></svg>