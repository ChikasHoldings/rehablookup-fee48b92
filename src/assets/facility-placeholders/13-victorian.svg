<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Restored Victorian house treatment facility with turret, gingerbread trim, bay window, and picket fence"><defs><linearGradient id="sky-vc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8F5EF"/><stop offset="1" stop-color="#F1F4EE"/></linearGradient><linearGradient id="wall-vc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EFE9DE"/><stop offset="1" stop-color="#D8CFBD"/></linearGradient><linearGradient id="trim-vc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5F7A57"/><stop offset="1" stop-color="#3F5A3A"/></linearGradient><radialGradient id="win-vc" cx=".5" cy=".5" r=".55"><stop offset="0" stop-color="#FFF8E8"/><stop offset="1" stop-color="#EFE0CB"/></radialGradient></defs><rect width="1600" height="1200" fill="url(#sky-vc)"/><circle cx="240" cy="240" r="80" fill="#EFE0CB" opacity=".5"/><circle cx="240" cy="240" r="34" fill="#EFE0CB" opacity=".85"/><path d="M 0,950 C 240,920 480,940 800,930 C 1120,920 1360,935 1600,925 L 1600,1000 L 0,1000 Z" fill="#C5D2B6" opacity=".65"/><!-- Background trees --><g transform="translate(180,720)"><rect x="-8" y="220" width="16" height="100" fill="#5F4226"/><circle cx="0" cy="140" r="120" fill="#7E9874"/></g><g transform="translate(1440,720)"><rect x="-8" y="220" width="16" height="100" fill="#5F4226"/><circle cx="0" cy="140" r="120" fill="#7E9874"/></g><!-- Turret tower (left) --><g><circle cx="490" cy="420" r="80" fill="url(#trim-vc)"/><rect x="450" y="420" width="80" height="50" fill="url(#trim-vc)"/><!-- Turret conical roof --><path d="M 410,420 L 490,260 L 570,420 Z" fill="#3F5A3A"/><circle cx="490" cy="260" r="6" fill="#5F4226"/><line x1="490" y1="260" x2="490" y2="220" stroke="#5F4226" stroke-width="3"/><circle cx="490" cy="216" r="6" fill="#5F4226"/><!-- Turret body --><rect x="410" y="470" width="160" height="500" fill="url(#wall-vc)"/><rect x="410" y="470" width="1