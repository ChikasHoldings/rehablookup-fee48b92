<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Multi-building treatment campus with central main building flanked by two wings and a landscaped courtyard"><defs><linearGradient id="sky-campus" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8F5EF"/><stop offset="1" stop-color="#F1F4EE"/></linearGradient><linearGradient id="wall-campus-main" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EFE9DE"/><stop offset="1" stop-color="#D8CFBD"/></linearGradient><linearGradient id="wall-campus-wing" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D8CFBD"/><stop offset="1" stop-color="#B8A88F"/></linearGradient><linearGradient id="roof-campus" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5F7A57"/><stop offset="1" stop-color="#7E9874"/></linearGradient><radialGradient id="window-campus" cx=".5" cy=".5" r=".55"><stop offset="0" stop-color="#FFF8E8"/><stop offset="1" stop-color="#EFE0CB"/></radialGradient><pattern id="dots-campus" x="0" y="0" width="38" height="38" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#5F7A57" fill-opacity=".05"/></pattern></defs><!-- Sky --><rect width="1600" height="1200" fill="url(#sky-campus)"/><rect width="1600" height="1200" fill="url(#dots-campus)"/><!-- Soft sun --><circle cx="240" cy="240" r="90" fill="#EFE0CB" opacity=".5"/><circle cx="240" cy="240" r="38" fill="#EFE0CB" opacity=".85"/><!-- Background hills --><path d="M 0,820 C 280,750 540,800 800,770 C 1060,740 1320,790 1600,760 L 1600,880 L 0,880 Z" fill="#C5D2B6" opacity=".55"/><path d="M 0,880 C 280,820 540,860 800,840 C 1060,820 1320,860 1600,830 L 1600,930 L 0,930 Z" fill="#A3B795" opacity=".55"/><!-- Background trees --><g opacity=".55" fill="#5F7A57"><ellipse cx="100" cy="880" rx="50" ry="70"/><ellipse cx="1500" cy="880" rx="50" ry="70"/></g><!-- Left wing --><g><!-- Pitched roof --><path d="M 130,720 L 320,580 L 510,720 Z" fill="url(#roof-campus)"/><rect x="120" y="710" width="400" height="14" fill="#5F7A57"/><!-- Wall --><rect x="150" y="724" width="340" height="300" fill="url(#wall-campus-wing)"/><rect x="150" y="724" width="340" height="300" fill="none" stroke="#B8A88F" stroke-width="2"/><!-- Windows row 1 --><g fill="url(#window-campus)" stroke="#7E5E48" stroke-width="2"><rect x="180" y="760" width="80" height="80" rx="3"/><rect x="280" y="760" width="80" height="80" rx="3"/><rect x="380" y="760" width="80" height="80" rx="3"/></g><!-- Windows row 2 --><g fill="url(#window-campus)" stroke="#7E5E48" stroke-width="2"><rect x="180" y="870" width="80" height="80" rx="3"/><rect x="280" y="870" width="80" height="80" rx="3"/><rect x="380" y="870" width="80" height="80" rx="3"/></g><!-- Door --><rect x="290" y="960" width="60" height="64" rx="3" fill="#C58B73" stroke="#7E5E48" stroke-width="2"/></g><!-- Right wing --><g><path d="M 1090,720 L 1280,580 L 1470,720 Z" fill="url(#roof-campus)"/><rect x="1080" y="710" width="400" height="14" fill="#5F7A57"/><rect x="1110" y="724" width="340" height="300" fill="url(#wall-campus-wing)"/><rect x="1110" y="724" width="340" height="300" fill="none" stroke="#B8A88F" stroke-width="2"/><g fill="url(#window-campus)" stroke="#7E5E48" stroke-width="2"><rect x="1140" y="760" width="80" height="80" rx="3"/><rect x="1240" y="760" width="80" height="80" rx="3"/><rect x="1340" y="760" width="80" height="80" rx="3"/></g><g fill="url(#window-campus)" stroke="#7E5E48" stroke-width="2"><rect x="1140" y="870" width="80" height="80" rx="3"/><rect x="1240" y="870" width="80" height="80" rx="3"/><rect x="1340" y="870" width="80" height="80" rx="3"/></g><rect x="1250" y="960" width="60" height="64" rx="3" fill="#C58B73" stroke="#7E5E48" stroke-width="2"/></g><!-- Connector arcade — left --><g><rect x="490" y="900" width="80" height="124" fill="url(#wall-campus-wing)"/><rect x="490" y="900" width="80" height="124" fill="none" stroke="#B8A88F" stroke-width="2"/><path d="M 500,920 A 30,30 0 0 1 560,920 L 560,1000 L 500,1000 Z" fill="#7E9874" opacity=".5"/></g><!-- Connector arcade — right --><g><rect x="1030" y="900" width="80" height="124" fill="url(#wall-campus-wing)"/><rect x="1030" y="900" width="80" height="124" fill="none" stroke="#B8A88F" stroke-width="2"/><path d="M 1040,920 A 30,30 0 0 1 1100,920 L 1100,1000 L 1040,1000 Z" fill="#7E9874" opacity=".5"/></g><!-- Main central building --><g><!-- Pitched roof --><path d="M 530,540 L 800,360 L 1070,540 Z" fill="url(#roof-campus)"/><rect x="520" y="530" width="560" height="16" fill="#5F7A57"/><!-- Small bell-tower / cupola on top --><rect x="780" y="280" width="40" height="80" fill="#B8A88F"/><path d="M 770,280 L 800,240 L 830,280 Z" fill="#5F7A57"/><circle cx="800" cy="320" r="6" fill="#EFE0CB"/><!-- Walls --><rect x="560" y="546" width="480" height="478" fill="url(#wall-campus-main)"/><rect x="560" y="546" width="480" height="478" fill="none" stroke="#B8A88F" stroke-width="2"/><!-- Floor divider --><rect x="560" y="780" width="480" height="6" fill="#B8A88F" opacity=".7"/><!-- Upper-floor windows (3) --><g fill="url(#window-campus)" stroke="#7E5E48" stroke-width="3"><rect x="600" y="600" width="100" height="140" rx="4"/><rect x="750" y="600" width="100" height="140" rx="4"/><rect x="900" y="600" width="100" height="140" rx="4"/></g><g stroke="#7E5E48" stroke-width="1.5" opacity=".7"><line x1="650" y1="600" x2="650" y2="740"/><line x1="600" y1="670" x2="700" y2="670"/><line x1="800" y1="600" x2="800" y2="740"/><line x1="750" y1="670" x2="850" y2="670"/><line x1="950" y1="600" x2="950" y2="740"/><line x1="900" y1="670" x2="1000" y2="670"/></g><!-- Lower-floor flanking windows --><g fill="url(#window-campus)" stroke="#7E5E48" stroke-width="3"><rect x="600" y="820" width="100" height="160" rx="4"/><rect x="900" y="820" width="100" height="160" rx="4"/></g><!-- Central entrance: tall doors + arched transom --><rect x="730" y="800" width="140" height="220" fill="#5F4226"/><rect x="745" y="840" width="50" height="180" rx="3" fill="#C58B73" stroke="#7E5E48" stroke-width="2"/><rect x="805" y="840" width="50" height="180" rx="3" fill="#C58B73" stroke="#7E5E48" stroke-width="2"/><path d="M 730,800 A 70,40 0 0 1 870,800 Z" fill="url(#window-campus)" stroke="#7E5E48" stroke-width="3"/><circle cx="790" cy="940" r="4" fill="#5F4226"/><circle cx="810" cy="940" r="4" fill="#5F4226"/><!-- Entrance steps --><rect x="710" y="1020" width="180" height="14" fill="#7E5E48"/><rect x="700" y="1034" width="200" height="14" fill="#947F5E"/></g><!-- Ground --><rect x="0" y="1024" width="1600" height="180" fill="#7E9874"/><rect x="0" y="1024" width="1600" height="14" fill="#5F7A57"/><!-- Courtyard path (center forward) --><path d="M 700,1048 L 900,1048 L 980,1200 L 620,1200 Z" fill="#D8CFBD"/><path d="M 700,1048 L 900,1048 L 980,1200 L 620,1200 Z" fill="none" stroke="#B8A88F" stroke-width="2"/><!-- Courtyard plantings between buildings --><g><ellipse cx="560" cy="1060" rx="48" ry="20" fill="#5F7A57"/><ellipse cx="560" cy="1050" rx="48" ry="20" fill="#7E9874"/><ellipse cx="1040" cy="1060" rx="48" ry="20" fill="#5F7A57"/><ellipse cx="1040" cy="1050" rx="48" ry="20" fill="#7E9874"/></g><!-- Foreground hedges across each building base --><g><rect x="160" y="1018" width="320" height="22" fill="#5F7A57"/><rect x="160" y="1010" width="320" height="14" fill="#7E9874"/><rect x="1120" y="1018" width="320" height="22" fill="#5F7A57"/><rect x="1120" y="1010" width="320" height="14" fill="#7E9874"/></g><!-- Verification mark --><g opacity=".4" transform="translate(60,60)"><rect x="0" y="0" width="44" height="44" rx="10" fill="none" stroke="#2C2E2A" stroke-width="2"/><path d="M 11,23 L 19,31 L 33,15" fill="none" stroke="#2C2E2A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></svg>