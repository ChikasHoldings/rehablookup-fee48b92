<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Single-story modern outpatient clinic with floor-to-ceiling windows and entrance awning"><defs><linearGradient id="sky-clinic" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8F5EF"/><stop offset="1" stop-color="#F1F4EE"/></linearGradient><linearGradient id="wall-clinic" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EFE9DE"/><stop offset="1" stop-color="#D8CFBD"/></linearGradient><linearGradient id="window-clinic" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8F1F7"/><stop offset="1" stop-color="#C5D2B6"/></linearGradient><pattern id="dots-clinic" x="0" y="0" width="38" height="38" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#5F7A57" fill-opacity=".05"/></pattern></defs><!-- Sky --><rect width="1600" height="1200" fill="url(#sky-clinic)"/><rect width="1600" height="1200" fill="url(#dots-clinic)"/><!-- Soft sun --><circle cx="1330" cy="240" r="80" fill="#EFE0CB" opacity=".5"/><circle cx="1330" cy="240" r="36" fill="#EFE0CB" opacity=".85"/><!-- Distant hill --><path d="M 0,970 C 320,920 640,950 960,930 C 1280,910 1440,940 1600,920 L 1600,1010 L 0,1010 Z" fill="#C5D2B6" opacity=".65"/><!-- Roof slab (shadow) --><rect x="200" y="540" width="1200" height="40" fill="#5F7A57"/><rect x="200" y="540" width="1200" height="14" fill="#3F5A3A"/><!-- Building body --><rect x="220" y="580" width="1160" height="440" fill="url(#wall-clinic)"/><rect x="220" y="580" width="1160" height="440" fill="none" stroke="#B8A88F" stroke-width="2"/><!-- Vertical wall accents (architectural breaks) --><rect x="498" y="580" width="6" height="440" fill="#B8A88F" opacity=".6"/><rect x="794" y="580" width="6" height="440" fill="#B8A88F" opacity=".6"/><rect x="1096" y="580" width="6" height="440" fill="#B8A88F" opacity=".6"/><!-- Floor-to-ceiling window panels --><g><rect x="244" y="640" width="240" height="360" rx="4" fill="url(#window-clinic)" stroke="#7E5E48" stroke-width="3"/><line x1="364" y1="640" x2="364" y2="1000" stroke="#7E5E48" stroke-width="2"/><line x1="244" y1="820" x2="484" y2="820" stroke="#7E5E48" stroke-width="2"/><rect x="518" y="640" width="260" height="360" rx="4" fill="url(#window-clinic)" stroke="#7E5E48" stroke-width="3"/><line x1="648" y1="640" x2="648" y2="1000" stroke="#7E5E48" stroke-width="2"/><line x1="518" y1="820" x2="778" y2="820" stroke="#7E5E48" stroke-width="2"/><rect x="1116" y="640" width="240" height="360" rx="4" fill="url(#window-clinic)" stroke="#7E5E48" stroke-width="3"/><line x1="1236" y1="640" x2="1236" y2="1000" stroke="#7E5E48" stroke-width="2"/><line x1="1116" y1="820" x2="1356" y2="820" stroke="#7E5E48" stroke-width="2"/></g><!-- Entrance section (middle-right) --><g><!-- Awning --><rect x="820" y="700" width="260" height="22" fill="#5F7A57"/><path d="M 820,700 L 1080,700 L 1080,722 L 1080,740 L 820,740 L 820,722 Z" fill="#7E9874"/><!-- Awning posts --><rect x="828" y="722" width="6" height="280" fill="#B8A88F"/><rect x="1066" y="722" width="6" height="280" fill="#B8A88F"/><!-- Double glass doors --><rect x="836" y="760" width="116" height="240" rx="3" fill="url(#window-clinic)" stroke="#7E5E48" stroke-width="3"/><rect x="954" y="760" width="116" height="240" rx="3" fill="url(#window-clinic)" stroke="#7E5E48" stroke-width="3"/><line x1="894" y1="760" x2="894" y2="1000" stroke="#7E5E48" stroke-width="1.5" opacity=".6"/><line x1="1012" y1="760" x2="1012" y2="1000" stroke="#7E5E48" stroke-width="1.5" opacity=".6"/><!-- Door handles --><circle cx="942" cy="880" r="4" fill="#7E5E48"/><circle cx="964" cy="880" r="4" fill="#7E5E48"/><!-- Subtle name plate --><rect x="836" y="610" width="234" height="60" rx="6" fill="#EFE9DE" stroke="#B8A88F" stroke-width="2"/><rect x="858" y="630" width="190" height="20" rx="2" fill="#B8A88F" opacity=".5"/></g><!-- Ground --><rect x="0" y="1000" width="1600" height="200" fill="#7E9874"/><rect x="0" y="1000" width="1600" height="14" fill="#5F7A57"/><!-- Walkway from entrance --><path d="M 836,1020 L 1070,1020 L 1170,1200 L 736,1200 Z" fill="#D8CFBD"/><path d="M 836,1020 L 1070,1020 L 1170,1200 L 736,1200 Z" fill="none" stroke="#B8A88F" stroke-width="2"/><!-- Foundation planting boxes --><g><rect x="244" y="1010" width="240" height="32" fill="#5F7A57"/><ellipse cx="300" cy="1010" rx="34" ry="20" fill="#A3B795"/><ellipse cx="380" cy="1010" rx="32" ry="22" fill="#7E9874"/><ellipse cx="450" cy="1010" rx="30" ry="18" fill="#A3B795"/><rect x="1116" y="1010" width="240" height="32" fill="#5F7A57"/><ellipse cx="1170" cy="1010" rx="30" ry="20" fill="#7E9874"/><ellipse cx="1250" cy="1010" rx="34" ry="22" fill="#A3B795"/><ellipse cx="1320" cy="1010" rx="32" ry="18" fill="#7E9874"/></g><!-- Verification mark --><g opacity=".4" transform="translate(60,60)"><rect x="0" y="0" width="44" height="44" rx="10" fill="none" stroke="#2C2E2A" stroke-width="2"/><path d="M 11,23 L 19,31 L 33,15" fill="none" stroke="#2C2E2A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></svg>