<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Mid-century modern flat-roof treatment center with floor-to-ceiling glass and feature stone wall"><defs><linearGradient id="sky-mc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8F5EF"/><stop offset="1" stop-color="#F1F4EE"/></linearGradient><linearGradient id="wall-mc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EFE9DE"/><stop offset="1" stop-color="#D8CFBD"/></linearGradient><linearGradient id="stone-mc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#947F5E"/><stop offset="1" stop-color="#7E5E48"/></linearGradient><linearGradient id="win-mc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8F1F7"/><stop offset="1" stop-color="#C5D2B6"/></linearGradient></defs><rect width="1600" height="1200" fill="url(#sky-mc)"/><circle cx="240" cy="240" r="80" fill="#EFE0CB" opacity=".55"/><circle cx="240" cy="240" r="34" fill="#EFE0CB" opacity=".85"/><!-- Distant horizon --><path d="M 0,910 C 320,880 640,900 960,890 C 1280,880 1440,900 1600,890 L 1600,960 L 0,960 Z" fill="#C5D2B6" opacity=".6"/><!-- Long horizontal flat roof (overhanging) --><rect x="120" y="540" width="1360" height="40" fill="#3F5A3A"/><rect x="120" y="540" width="1360" height="14" fill="#2C2E2A" opacity=".5"/><!-- Roof shadow line under overhang --><rect x="160" y="580" width="1280" height="10" fill="#5F7A57" opacity=".3"/><!-- Carport extension on right --><rect x="1280" y="580" width="200" height="14" fill="#5F7A57"/><rect x="1290" y="594" width="6" height="380" fill="#7E5E48"/><rect x="1465" y="594" width="6" height="380" fill="#7E5E48"/><!-- Main building walls --><rect x="160" y="580" width="1120" height="420" fill="url(#wall-mc)"/><rect x="160" y="580" width="1120" height="420" fill="none" stroke="#B8A88F" stroke-width="2"/><!-- Feature stone wall on left --><rect x="160" y="580" width="240" height="420" fill="url(#stone-mc)"/><g fill=