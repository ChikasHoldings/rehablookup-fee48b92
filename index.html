              <p style="color: #444; line-height: 1.7; margin-bottom: 16px;">RehabLookup is the nation's most comprehensive addiction treatment directory, trusted by thousands of families seeking recovery resources. Our platform was built with one mission: to make finding quality substance abuse treatment simple, transparent, and accessible to everyone — regardless of insurance, location, or financial situation.</p>

            <section class="ns-section">
              <h2 class="ns-h2">Types of Addiction Treatment Programs</h2>
              <p style="color: #444; line-height: 1.7; margin-bottom: 16px;">Understanding the different levels of care is essential to finding the right treatment path. RehabLookup helps you compare these options side-by-side so you can make an informed decision for yourself or your loved one.</p>
              
              <h3 class="ns-h3">Medical Detox Programs</h3>
              <p style="color: #444; line-height: 1.7; margin-bottom: 16px;">Medical detoxification is often the first step in recovery. Under 24/7 medical supervision, patients safely manage withdrawal symptoms from alcohol, opioids, benzodiazepines, and other substances. Detox typically lasts 3–10 days and prepares individuals for ongoing treatment.</p>

              <h3 class="ns-h3">Inpatient &amp; Residential Rehabilitation</h3>
              <p style="color: #444; line-height: 1.7; margin-bottom: 16px;">Inpatient rehab provides immersive, round-the-clock care in a structured environment. Programs typically last 28–90 days and include individual therapy, group counseling, family sessions, and relapse prevention education. Residential treatment is ideal for individuals with severe addiction or co-occurring mental health disorders.</p>

              <h3 class="ns-h3">Outpatient Treatment Programs (IOP &amp; PHP)</h3>
              <p style="color: #444; line-height: 1.7; margin-bottom: 16px;">Outpatient programs allow patients to receive treatment while living at home. Intensive Outpatient Programs (IOP) typically involve 9–15 hours of therapy per week, while Partial Hospitalization Programs (PHP) offer 20+ hours. These are ideal for individuals stepping down from inpatient care or those with mild to moderate substance use disorders.</p>

              <h3 class="ns-h3">Dual Diagnosis Treatment</h3>
              <p style="color: #444; line-height: 1.7; margin-bottom: 16px;">Many people struggling with addiction also face co-occurring mental health conditions such as depression, anxiety, PTSD, or bipolar disorder. Dual diagnosis programs treat both conditions simultaneously using integrated, evidence-based approaches for better long-term outcomes.</p>

              <h3 class="ns-h3">Medication-Assisted Treatment (MAT)</h3>
              <p style="color: #444; line-height: 1.7; margin-bottom: 16px;">MAT combines FDA-approved medications like Suboxone (buprenorphine), methadone, or naltrexone with behavioral therapy. MAT is considered the gold standard for treating opioid use disorder and has been shown to reduce relapse rates, overdose deaths, and criminal activity.</p>
            </section>

            <section class="ns-section">
              <h2 class="ns-h2">Frequently Asked Questions About Addiction Treatment</h2>
              
              <p class="ns-faq-q">How much does rehab cost?</p>
              <p class="ns-faq-a">The cost of rehab varies widely depending on the type of program, length of stay, and location. Many insurance plans cover substance abuse treatment under the Mental Health Parity Act. Free and state-funded programs are also available. RehabLookup helps you find options that fit your budget, including facilities that accept Medicaid, Medicare, and sliding-scale fees.</p>

              <p class="ns-faq-q">How long does rehab take?</p>
              <p class="ns-faq-a">Treatment duration depends on the severity of addiction and the type of program. Detox typically lasts 3–10 days, while inpatient rehab programs range from 28 to 90 days. Outpatient programs may continue for 3–6 months or longer. Research shows that longer treatment durations are associated with better long-term recovery outcomes.</p>

              <p class="ns-faq-q">Does insurance cover addiction treatment?</p>
              <p class="ns-faq-a">Yes. Under the Affordable Care Act and Mental Health Parity Act, most insurance plans are required to cover substance abuse treatment. Major insurers including Aetna, Blue Cross Blue Shield, Cigna, United Healthcare, Humana, and Kaiser Permanente provide coverage for detox, inpatient, and outpatient programs. Medicaid and Medicare also cover treatment in many states.</p>

              <p class="ns-faq-q">What is the difference between inpatient and outpatient rehab?</p>
              <p class="ns-faq-a">Inpatient rehab requires patients to live at the treatment facility full-time, providing 24/7 structured care and supervision. Outpatient rehab allows patients to attend therapy sessions while continuing to live at home. Inpatient is recommended for severe addictions, while outpatient works well for mild to moderate cases or as a step-down from residential care.</p>

              <p class="ns-faq-q">Can I find free rehab near me?</p>
              <p class="ns-faq-a">Yes. Many states offer publicly funded treatment centers that provide free or low-cost services. SAMHSA-funded programs, faith-based organizations, and non-profit treatment centers also offer free options. Use RehabLookup to filter by "free" or "Medicaid-accepted" to find affordable options near you.</p>
