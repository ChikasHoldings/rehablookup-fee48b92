    <style>
      /* Critical CSS - inlined for instant render */
      :root {
        --background: 220 30% 97%;
        --foreground: 222 47% 11%;
        --primary: 216 55% 24%;
        --muted: 220 20% 96%;
      }
      html { scroll-behavior: smooth; }
      body { 
        margin: 0; 
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background-color: hsl(220 30% 97%);
        color: hsl(222 47% 11%);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root { min-height: 100vh; }
      /* Skeleton loading state */
      .loading-skeleton {
        background: linear-gradient(90deg, hsl(220 20% 96%) 25%, hsl(220 20% 92%) 50%, hsl(220 20% 96%) 75%);
        background-size: 200% 100%;
        animation: skeleton-loading 1.5s infinite;
      }
      @keyframes skeleton-loading {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      /* Prevent layout shift for images */
      img { content-visibility: auto; }
      /* Hide content until React hydrates */
      .js-loading { opacity: 0; }
      .js-loaded { opacity: 1; transition: opacity 0.2s ease-out; }
    </style>
