    <link rel="preload" as="image" href="/src/assets/hero-recovery.jpg" fetchpriority="high" type="image/jpeg" />

    <!-- Modulepreload for faster JS parsing -->
    <link rel="modulepreload" href="/src/main.tsx" />
    
    <!-- Critical CSS for above-the-fold content (prevents FOUC) -->
    <style>
      /* Critical CSS - inlined for instant render */
      :root {
        --background: 220 30% 97%;
        --foreground: 222 47% 11%;
        --primary: 216 55% 24%;
        --muted: 220 20% 96%;
      }
      html { scroll-behavior: smooth; }
      body { 
        margin: 0; 
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background-color: hsl(220 30% 97%);
        color: hsl(222 47% 11%);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root { min-height: 100vh; }
      /* Skeleton loading state */
      .loading-skeleton {
        background: linear-gradient(90deg, hsl(220 20% 96%) 25%, hsl(220 20% 92%) 50%, hsl(220 20% 96%) 75%);
        background-size: 200% 100%;
        animation: skeleton-loading 1.5s infinite;
      }
      @keyframes skeleton-loading {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      /* Prevent layout shift for images */
      img { content-visibility: auto; }
      /* Hide content until React hydrates */
      .js-loading { opacity: 0; }
      .js-loaded { opacity: 1; transition: opacity 0.2s ease-out; }
    </style>

    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "RehabLookup",
      "url": "https://rehablookup.com",
      "logo": "https://rehablookup.com/logo.svg",
      "description": "A trusted directory service connecting families with verified addiction treatment centers nationwide.",
      "foundingDate": "2024",
      "areaServed": {
        "@type": "Country",
        "name": "United States"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "help@rehablookup.com",
        "contactType": "customer service",
        "availableLanguage": "English",
        "areaServed": "US"
      },
      "sameAs": [
        "https://facebook.com/rehablookup",
        "https://twitter.com/rehablookup",
        "https://linkedin.com/company/rehablookup"
      ]
    }
    </script>

    <!-- Structured Data - Website with Search -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "RehabLookup",
      "url": "https://rehablookup.com",
      "description": "Find trusted addiction treatment centers near you. Search verified rehab facilities, compare programs, and get help today.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://rehablookup.com/rehab-centers?location={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Structured Data - MedicalWebPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MedicalWebPage",
      "name": "Find Addiction Treatment Centers",
      "about": {
        "@type": "MedicalCondition",
        "name": "Substance Use Disorder"
      },
      "audience": {
        "@type": "PeopleAudience",
        "audienceType": "Patients seeking addiction treatment"
      },
      "specialty": "Addiction Medicine"
    }
    </script>
  </head>

  <body>
    <div id="root" class="js-loading"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Mark as loaded once React hydrates
      document.getElementById('root').classList.add('js-loaded');
      document.getElementById('root').classList.remove('js-loading');
    </script>
    <!-- Prefetch likely next pages for instant navigation -->
    <link rel="prefetch" href="/rehab-centers" as="document" />
