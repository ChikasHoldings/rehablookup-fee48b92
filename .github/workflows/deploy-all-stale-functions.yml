name: Deploy All Branch-Drifted Functions

# Manual trigger only. Deploys every Supabase edge function whose
# index.ts has been modified on the selected branch relative to main.
# Use this for "deploy everything that's drifted" — much broader than
# the deploy-admin-edge-functions workflow which targets a curated
# admin-only list.
#
# Trigger from:
# https://github.com/chikasholdings/rehablookup-fee48b92/actions/workflows/deploy-all-stale-functions.yml
#
# When running, set "Use workflow from" to claude/phase2-deployment-5WYOn
# (or whichever feature branch has the drift). The workflow checks out
# THAT branch, diffs against base_branch, and deploys every modified
# function source.
#
# REQUIRED REPO SECRET:
#   SUPABASE_ACCESS_TOKEN (already set if you used the admin workflow)

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: 'Base branch to compare against. Functions modified on the feature branch vs this base will be deployed.'
        required: true
        default: 'main'
        type: string
      dry_run:
        description: 'Dry run: print the list of functions but DO NOT deploy.'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repo (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify CLI + secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase --version
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set."
            echo "Add it at: https://github.com/chikasholdings/rehablookup-fee48b92/settings/secrets/actions/new"
            exit 1
          fi
          echo "CLI ready."

      - name: Discover functions to deploy
        id: discover
        run: |
          BASE="${{ inputs.base_branch }}"
          echo "Comparing against origin/$BASE"
          git fetch origin "$BASE" --quiet

          # Find every function dir whose index.ts has any diff vs base.
          # Excludes _shared (those are imports, not deployable functions).
          mapfile -t FNS < <(
            git diff --name-only "origin/$BASE"...HEAD -- 'supabase/functions/*/index.ts' \
              | grep -v '^supabase/functions/_shared/' \
              | awk -F/ '{print $3}' \
              | sort -u
          )

          echo "Found ${#FNS[@]} functions modified on this branch vs origin/$BASE:"
          printf '  %s\n' "${FNS[@]}"

          # Save to output for next step
          {
            echo 'functions<<EOF'
            printf '%s\n' "${FNS[@]}"
            echo EOF
          } >> "$GITHUB_OUTPUT"
          echo "count=${#FNS[@]}" >> "$GITHUB_OUTPUT"

      - name: Deploy each function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set +e  # Continue on individual failures so we deploy as many as possible

          DRY="${{ inputs.dry_run }}"

          # Read function list from previous step's output
          mapfile -t FNS << 'EOF_FNS'
          ${{ steps.discover.outputs.functions }}
          EOF_FNS

          TOTAL=0
          OK=0
          FAILED=0
          FAILED_LIST=()
          SKIPPED=0

          for FN in "${FNS[@]}"; do
            [ -z "$FN" ] && continue
            TOTAL=$((TOTAL+1))

            # Safety: confirm the function file exists locally
            if [ ! -f "supabase/functions/$FN/index.ts" ]; then
              echo "::warning::Skipping $FN — file does not exist at supabase/functions/$FN/index.ts"
              SKIPPED=$((SKIPPED+1))
              continue
            fi

            echo "════════════════════════════════════════════════════════"
            echo "[$TOTAL] $FN"
            echo "════════════════════════════════════════════════════════"

            if [ "$DRY" = "true" ]; then
              echo "  (dry run — skipping actual deploy)"
              OK=$((OK+1))
              continue
            fi

            if supabase functions deploy "$FN" \
              --project-ref mldbxpntzcjalgjmwnqa \
              --no-verify-jwt; then
              OK=$((OK+1))
              echo "  ✓ deployed $FN"
            else
              FAILED=$((FAILED+1))
              FAILED_LIST+=("$FN")
              echo "  ✗ FAILED $FN"
            fi
          done

          echo ""
          echo "════════════════════════════════════════════════════════"
          echo "Deploy Summary"
          echo "════════════════════════════════════════════════════════"
          echo "Total:    $TOTAL"
          echo "Success:  $OK"
          echo "Failed:   $FAILED"
          echo "Skipped:  $SKIPPED  (file missing in working tree)"
          if [ "$DRY" = "true" ]; then
            echo "(dry run — no actual deploys executed)"
          fi
          echo ""
          if [ ${#FAILED_LIST[@]} -gt 0 ]; then
            echo "Failed functions:"
            printf '  - %s\n' "${FAILED_LIST[@]}"
            exit 1
          fi

      - name: Done
        run: |
          echo "✓ Deploy run complete."
          echo "Verify in the dashboard:"
          echo "  https://supabase.com/dashboard/project/mldbxpntzcjalgjmwnqa/functions"
