name: 404 / Broken Route Crawler

# Catches new 404s and missing-route regressions.
#
# Two modes:
#   • PR + push to main: STATIC mode — runs the offline sitemap/HTML/Route
#     parity validators (find-404-sources.mjs + validate-internal-links.mjs).
#     Fast, deterministic, blocks merges on regressions.
#
#   • Nightly schedule + manual dispatch: LIVE mode — actually HTTP-fetches
#     every sitemap URL against the deployed production origin, surfaces real
#     4xx/5xx responses, uploads a markdown report, and fails the run if any
#     URL is broken (so the user sees a red status on the schedule run).
#
# Monitoring:
#   • A dedicated `notify-on-failure` job fires after all jobs complete and
#     posts a rich failure summary to the GitHub Step Summary. If the optional
#     NOTIFY_WEBHOOK_URL secret is set, it also sends a JSON POST to that URL
#     (compatible with Slack incoming webhooks, Discord, or any HTTP endpoint).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # 04:17 UTC every day — off the hour to avoid GitHub's cron stampede.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Origin to crawl (e.g. https://rehablookup.com)"
        required: false
        default: "https://rehablookup.com"
      concurrency:
        description: "Parallel requests"
        required: false
        default: "16"
      max_urls:
        description: "Cap on URLs crawled (blank = all)"
        required: false
        default: ""

concurrency:
  group: crawl-404-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-route-audit:
    name: Static route / sitemap parity (PR gate)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - name: Regenerate sitemaps & static facility profiles
        run: |
          npm run generate:facility-profiles-html
          npm run generate:sitemaps
      - name: Find unresolved internal URLs (offline)
        run: node scripts/find-404-sources.mjs
      - name: Validate internal links match Routes
        run: npm run check:internal-links

  live-crawl:
    name: Live 404 crawl (scheduled)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --no-audit --no-fund

      - name: Crawl deployed origin
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://rehablookup.com' }}
          CONCURRENCY: ${{ github.event.inputs.concurrency || '16' }}
          MAX_URLS: ${{ github.event.inputs.max_urls }}
          REPORT_PATH: ${{ github.workspace }}/crawl-404-report.md
        run: node scripts/crawl-live-404s.mjs

      - name: Upload crawl report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-404-report
          path: crawl-404-report.md
          if-no-files-found: warn

      - name: Append report to job summary
        if: always()
        run: |
          if [ -f crawl-404-report.md ]; then
            cat crawl-404-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

  link-checker:
    # Full link checker (internal + external HEAD requests). Nightly only —
    # external uptime noise must not block PRs. Sets FAIL_ON_EXTERNAL=1 so
    # broken external links go red here (visible on the schedule run) while
    # PRs only enforce internal-link integrity via seo-validators.yml.
    name: Link checker (internal + external)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --no-audit --no-fund

      - name: Regenerate sitemaps & static facility profiles
        run: |
          npm run generate:facility-profiles-html
          npm run generate:sitemaps

      - name: Run link checker
        env:
          FAIL_ON_EXTERNAL: "1"
          REPORT_PATH: ${{ github.workspace }}/broken-links-report.md
        run: node scripts/check-broken-links.mjs

      - name: Upload broken-links report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broken-links-report
          path: broken-links-report.md
          if-no-files-found: warn

      - name: Append report to job summary
        if: always()
        run: |
          if [ -f broken-links-report.md ]; then
            cat broken-links-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

  notify-on-failure:
    name: Failure notification
    # Run after all other jobs, only if at least one failed
    needs: [static-route-audit, live-crawl, link-checker]
    if: |
      always() &&
      (
        needs.static-route-audit.result == 'failure' ||
        needs.live-crawl.result == 'failure' ||
        needs.link-checker.result == 'failure'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build failure summary
        id: summary
        run: |
          FAILED_JOBS=""
          if [ "${{ needs.static-route-audit.result }}" = "failure" ]; then
            FAILED_JOBS="${FAILED_JOBS} • Static route / sitemap parity\n"
          fi
          if [ "${{ needs.live-crawl.result }}" = "failure" ]; then
            FAILED_JOBS="${FAILED_JOBS} • Live 404 crawl\n"
          fi
          if [ "${{ needs.link-checker.result }}" = "failure" ]; then
            FAILED_JOBS="${FAILED_JOBS} • Link checker (internal + external)\n"
          fi

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Write to GitHub Step Summary
          echo "## ❌ 404 / Broken Route Crawler — Failure Alert" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Repository:** \`${{ github.repository }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Triggered by:** ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Run time:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Failed jobs:" >> "$GITHUB_STEP_SUMMARY"
          echo -e "${FAILED_JOBS}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### What to do:" >> "$GITHUB_STEP_SUMMARY"
          echo "1. [View the full run logs](${RUN_URL})" >> "$GITHUB_STEP_SUMMARY"
          echo "2. Check the uploaded artifacts (crawl-404-report.md, broken-links-report.md) for details" >> "$GITHUB_STEP_SUMMARY"
          echo "3. Fix any broken routes or links in the codebase" >> "$GITHUB_STEP_SUMMARY"
          echo "4. Push a fix commit — the static-route-audit will re-run automatically" >> "$GITHUB_STEP_SUMMARY"

          # Export for webhook step
          echo "run_url=${RUN_URL}" >> "$GITHUB_OUTPUT"
          echo "failed_jobs<<EOF" >> "$GITHUB_OUTPUT"
          echo -e "${FAILED_JOBS}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Send webhook notification (if configured)
        # Only runs if NOTIFY_WEBHOOK_URL secret is set
        # Compatible with Slack incoming webhooks, Discord, or any HTTP endpoint
        # Note: secrets context cannot be used in step 'if' conditions directly;
        # instead we check the env var is non-empty inside the run script.
        env:
          WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          RUN_URL: ${{ steps.summary.outputs.run_url }}
          FAILED_JOBS: ${{ steps.summary.outputs.failed_jobs }}
        run: |
          if [ -z "${WEBHOOK_URL}" ]; then
            echo "No NOTIFY_WEBHOOK_URL configured — skipping webhook notification."
            exit 0
          fi
          PAYLOAD=$(cat <<JSONEOF
          {
            "text": "❌ *404 / Broken Route Crawler failed* on \`${{ github.repository }}\`\n\n*Failed jobs:*\n${FAILED_JOBS}\n\n*Triggered by:* ${{ github.event_name }}\n*View run:* ${RUN_URL}"
          }
          JSONEOF
          )
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "${WEBHOOK_URL}" \
            --max-time 10 || echo "Webhook notification failed (non-blocking)"
