name: Deploy Admin Edge Functions

# Manual trigger only — go to:
# https://github.com/chikasholdings/rehablookup-fee48b92/actions/workflows/deploy-admin-edge-functions.yml
# Click "Run workflow" button on the right side.
#
# REQUIRED REPO SECRET:
#   SUPABASE_ACCESS_TOKEN — personal access token from
#     https://supabase.com/dashboard/account/tokens
#   Add it at:
#     https://github.com/chikasholdings/rehablookup-fee48b92/settings/secrets/actions/new
#   Name: SUPABASE_ACCESS_TOKEN
#   Value: <paste the sbp_v0_... token>

on:
  workflow_dispatch:
    inputs:
      include_optional:
        description: 'Also redeploy the 14 docstring-only functions (true) or just the 2 critical ones (false)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify CLI + login
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase --version
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set."
            echo "Add it at: https://github.com/chikasholdings/rehablookup-fee48b92/settings/secrets/actions/new"
            exit 1
          fi
          echo "CLI ready."

      - name: Deploy CRITICAL admin functions (2)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          for fn in \
            admin-bulk-update-concierge-status \
            auto-status-transition \
          ; do
            echo "=== Deploying $fn (critical) ==="
            supabase functions deploy "$fn" \
              --project-ref mldbxpntzcjalgjmwnqa \
              --no-verify-jwt
          done

      - name: Deploy OPTIONAL admin functions (14)
        if: ${{ inputs.include_optional == 'true' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          for fn in \
            admin-bulk-update-lead-status \
            admin-bulk-reassign-leads \
            admin-resend-lead-notification \
            admin-bulk-update-ivr-status \
            submit-insurance-verification \
            admin-bulk-update-provider-flags \
            admin-bulk-update-provider-status \
            admin-bulk-ban-seekers \
            admin-bulk-reassign-concierge-advisor \
            admin-bulk-update-support-tickets \
            admin-bulk-moderate-reviews \
            admin-bulk-update-escalations \
            admin-bulk-update-marketing-leads \
            admin-bulk-update-blog-articles \
          ; do
            echo "=== Deploying $fn (optional) ==="
            supabase functions deploy "$fn" \
              --project-ref mldbxpntzcjalgjmwnqa \
              --no-verify-jwt
          done

      - name: Summary
        run: |
          echo "✓ Deploy run complete."
          echo "Verify in the dashboard:"
          echo "  https://supabase.com/dashboard/project/mldbxpntzcjalgjmwnqa/functions"
