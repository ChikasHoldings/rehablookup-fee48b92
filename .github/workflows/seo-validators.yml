name: SEO Validators

# Runs SEO/sitemap pre-deploy validators on every push and PR so static-vs-sitemap
# mismatches block the change before it reaches Vercel.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref so a force-push doesn't double-spend CI.
concurrency:
  group: seo-validators-${{ github.ref }}
  cancel-in-progress: true

jobs:
  facility-sitemap-sync:
    name: Facility profile ↔ sitemap sync
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Job-level so the live post-deploy steps below can gate on it. A step's
    # own `env:` block is NOT in scope for that same step's `if:` (the
    # conditional is evaluated before step env is applied), so declaring it
    # per-step made `if: env.VERCEL_URL != ''` always false and both live
    # checks silently skipped even when the secret was set.
    env:
      VERCEL_URL: ${{ secrets.VERCEL_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Track .nvmrc (22) so CI validates on the same major as the
          # dev/production builds instead of drifting a version behind.
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Regenerate the static /center/*.html mirrors and sitemap from the live
      # database so the validator catches drift between code and what would
      # actually deploy. Both scripts no-op gracefully when DB creds are absent.
      - name: Generate facility profiles HTML
        run: npm run generate:facility-profiles-html

      - name: Generate sitemaps
        run: npm run generate:sitemaps

      - name: Verify /center/*.html ↔ sitemap-facilities sync
        run: npm run check:facility-sitemap-sync

      - name: Validate sitemap & robots
        run: npm run validate:sitemap-robots

      - name: Verify per-page SEO meta (title/description/canonical/OG)
        run: npm run check:seo-meta

      - name: Verify cross-page meta uniqueness
        run: npm run check:unique-meta

      - name: Verify SPA <Navigate> ↔ vercel.json 301 parity
        run: npm run check:redirect-parity

      # Live post-deploy crawl — only runs when VERCEL_URL secret is set
      # (typically pointed at the Vercel preview for the PR or the production
      # apex). Skips silently otherwise so PRs don't fail before cutover.
      - name: Post-deploy Vercel validator (live crawl)
        if: env.VERCEL_URL != ''
        run: npm run validate:vercel-deploy

      # Live hub & near-me coverage: every prerendered hub must return 200
      # (or 301→canonical hub) with the correct <title> + canonical on the
      # deployed host. Catches SPA-fallback regressions, missing prerenders,
      # and stale canonicals before they hit Google.
      - name: Verify hub & near-me routes (live)
        if: env.VERCEL_URL != ''
        run: node scripts/check-hub-routes.mjs --host "$VERCEL_URL" --concurrency 16


      # Internal-link check on every PR/push — fast, deterministic, no network.
      # External links are validated nightly in crawl-404.yml so upstream
      # uptime noise can't block merges.
      - name: Verify internal links resolve (offline)
        run: npm run check:broken-links:internal

      - name: Upload broken-links report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broken-links-report-pr
          path: broken-links-report.md
          if-no-files-found: ignore
