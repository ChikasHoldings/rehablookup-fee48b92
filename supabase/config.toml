# ─────────────────────────────────────────────────────────────────────────────
# Edge-function JWT verification policy
#
# Every function under supabase/functions/ is classified into one of 5 buckets:
#
#   A. Webhook (signature-verified)        — verify_jwt = false  (vendor signature)
#   B. Anonymous public                    — verify_jwt = false  (rate-limited)
#   C. Authenticated user                  — verify_jwt = true
#   D. Admin-only                          — verify_jwt = true + in-fn admin check
#   E. Cron-triggered                      — verify_jwt = false + X-Cron-Secret
#
# CI: `node scripts/check-edge-function-auth.mjs` validates this policy.
# Documentation: docs/edge-function-auth-audit-2026-05-22.md
# ─────────────────────────────────────────────────────────────────────────────

# ═════════════════════════════════════════════════════════════════════════════
# BUCKET A — Webhooks (signature-verified inside the function)
# ═════════════════════════════════════════════════════════════════════════════

[functions.stripe-webhook]
verify_jwt = false

[functions.twilio-sms-inbound]
verify_jwt = false

