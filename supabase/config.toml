# verify_jwt=false so the function can do its own auth: the body
# explicitly calls supabase.auth.getUser() against the caller's
# Authorization header and only acts when the JWT belongs to a
# provider who owns the targeted facility. Matches the pattern
# used by send-support-request.
[functions.send-review-request]
verify_jwt = false

# verify_jwt=false because this function has DUAL auth: X-Cron-Secret
# header for the nightly batch (pg_cron has no JWT), OR Authorization
# header for the single-facility ad-hoc sync fired from the provider
# portal. The function body picks the path based on which header is
# present and validates each independently.
[functions.sync-google-reviews]
verify_jwt = false

# Cron-only orchestrator for the re-verification monitoring engine.
# Calls run_data_feed_diff(), run_expiry_sweep(), and
# run_backstop_sweep() in order. pg_cron has no JWT so verify_jwt is
# off; X-Cron-Secret is required.
[functions.run-re-verification-sweep]
verify_jwt = false

# verify_jwt=false so the function does its own ownership + Pro +
# verified gating against the caller JWT. Same pattern as
# send-review-request. Generates a personalised marketing/credibility
# kit (PDF cert + SVG badge + email signature + social images), zips
# it, uploads to the credential-kits storage bucket, and returns a
# 1-hour signed URL.
[functions.generate-credential-kit]
verify_jwt = false
